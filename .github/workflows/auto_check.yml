name: auto check

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check:
    name: auto check
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: get ukagaka-developer
        # The scripts of the skill, pinned to a reviewed commit. To update, change ref to a newer commit of ukatech/ukagaka-developer.
        uses: actions/checkout@v4
        with:
          repository: ukatech/ukagaka-developer
          ref: 55ba839e8881b80437a6b65a44f87c72e99443dc
          path: .ukagaka-developer
          persist-credentials: false
      - name: dictionary check
        # Builds tamacs.exe with csc.exe of the .NET Framework on the runner, loads the SHIORI dll with it and reads
        # its log (YAYA or SATORI, found from ghost/master)
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.ukagaka-developer/skills/ukagaka-developer/scripts/check-dic.ps1" -Ci -GhostRoot $env:GITHUB_WORKSPACE'
